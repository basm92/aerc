# Example Presentation

---

# Motivation

- On your first slide, you present your "Motivation" - your research question and your setting

- You answer the questions "why should we care?" and "why is this question important?"
  - What will change if my research question is answered definitively?

- Ideally, you present several arguments, some of them resonating with common sense
  - But more importantly, you should also _briefly_ pay attention to the literature here
  - Note the emphasis on briefly: don't talk extensively about the literature
  - Just show that the academic community thinks these questions are important

---

# Literature and Background

- On your second slide, you go into slightly more detail about your issues

- You illustrate that there is a debate in the literature, and there is not much clarity in terms of results
  - You highlight several perspectives in the literature
  - You can also pay attention to various approaches and methods
  
- This is also the place where you make your _expectations_ (hypotheses) clear: what do you expect the answer to your RQ to be based on theory?
  
- You also talk about your _setting_: what country/area/situation are you studying? And why?
  - Is this a generalizable setting or is this super idiosyncratic?
  
---

# Third Optional Slide

- On this optional slide, you give a preview of your results

- You summarize your main results
  - You contrast these findings with the established literature
  - What are the novelties?

- You highlight potential policy implications

---

class: center, inverse, middle

# Data &amp; Methodology

---

# Data

- On your data slide, you explain the data sources you have used

- You try to be as specific as possible: where do the data sources come from?
- Are they reliable and consistent?

- What decisions have you made when collecting and putting the data together?

---

# Methodology

- On the *Methodology* or *Method* slides, you explain your empirical method

- This is an answer to the question: "How do I test my hypothesis?"
  - Your hypothesis is in turn an answer to your research question based on theory
  
- There should presumably be an equation on this page:

`$$Y_{ij} = \alpha + \beta_1 X_{ij} + \beta_2 Z_{ij} + \epsilon_{ij}$$`

- Where you _explain the indices_ (individual `\(i\)` for country `\(j\)`) and you explain what `\(Y\)` and `\(X\)` can be in your analyses 
- And you explain what the `\(\beta_1\)` coefficient should be
  - But only for your independent variable of interest: we don't care about control variables
  
- Finally, you don't estimate just one model, but a whole variety. You say something about what classes of models you estimate: you add more controls, you add fixed effects, etc.

# Conclusion

---

# Conclusion

- The final slide should contain a conclusion

- This is an answer to your research question

- You also explain to which literatures you contributed and what (policy) insights this finding has generated

- You pay attention to the weaknesses of your approach
  - Your research is not perfect
  - You have missed many things for which you did not have time/resources to get data
  - How could that potentially impact your results? 
  
- You close off with suggestions for further research
