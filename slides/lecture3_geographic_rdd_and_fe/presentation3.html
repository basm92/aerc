# Regression Discontinuity

---

# Introduction

- In the previous classes, I have focused on data collection and spatial data wrangling

- In this class, I'll focus on _analyzing_ these data

- In principle, there are various ways in which you can creative use spatial variation to identify a parameter of interest

- I'll just focus on one: a _geographic_ regression discontinuity design
  - Before I do that, I'll recapitulate the basic intuitions and terminology for an ordinary regression discontinuity design


---

class: inverse, center, middle

# Regression Discontinuity

---

# Basic Philosophy

- A _discontinuity_ occurs whenever some treatment is assigned discontinuously
  - People just on one side of a line get it, and people just on the other side of the line don’t
  - Historical example: test admission requirement in schools
  - Students with some score `\(s &gt; t\)` can be admitted to a school
  - Students with a score `\(s &lt; t\)` cannot
  
- A regression discontinuity analysis compares people just on either side of a cutoff. 

- Without the cutoff they’d likely be pretty similar. So if they’re different, we can probably attribute the difference to whatever it is that happens at that cutoff.

---

# Terminology

- _Running variable_: The running variable, also known as a forcing variable, is the variable that determines whether you’re treated or not. For example, if schools admit students with a score higher than `\(t\)`, but not with a score lower than `\(t\)`, then `score` is your running variable.

- _Cutoff_: The cutoff is the value of the running variable that determines whether you get treatment. Using the test score example, if you get a score above `\(t\)`, you get the treatment, if you get something below `\(t\)`, you don't.

- _Bandwidth_: It’s reasonable to think that people just barely to either side of the cutoff are basically the same other than for the cutoff. But people farther away (say, students with a very high score or a very low score) might be different for reasons other than the cutoff. The bandwidth is how much area around the cutoff you’re willing to consider comparable. 

---

# RDD Graphically

- Let's make a simulated RDD example:
  - The influence of a test score on later wages through the treatment, admission to a school


```r
df &lt;- tibble(score=runif(1000, 1, 10), treatment = if_else(score&gt;5.5, 1, 0),
             outcome = if_else(treatment == 1, 
                               score + rnorm(1000, 10, 5), score + rnorm(1000, 0, 5)))

df |&gt; ggplot(aes(x = score, y = outcome)) + 
  geom_point() +
  geom_vline(xintercept=5.5)
```

&lt;img src="presentation3_files/figure-html/unnamed-chunk-1-1.png" width="504" style="display: block; margin: auto;" /&gt;


---

# RDD Interpretation

- In this example, we have simulated the _cut-off_ to be 5.5. 
  - The idea is that individuals who score higher than a 5.5 get access to the treatment. 
  - And if you get access to the treatment, you get a higher `outcome`, e.g. wage, simulated from a normal distribution with `\(\mu=\text{score}+10\)` rather than `\(\mu=\text{score}\)` if you don't receive the treatment
  
- The most basic version of RDD allows for a jump but forces the slope to be the same on both sides of the cut-off:

$$
Y_i = \beta_0 + \beta_1 \times \text{Treated}_i + \beta_2 \times C_i + U_i
$$

where `\(\text{Treated}_i\)` = 1 if you are above the cut-off, `\(C_i\)` is the running variable centered around the cut-off `\(X_i - t\)`, and our coefficient of interest is `\(\beta_1\)`, how the intercept changes as a result of treatment status

---

# RDD Estimation

- This previous equation can be estimated on our data, for example, using the `feols` function from the `fixest` package:


```r
df |&gt; mutate(xc = score - 5.5) |&gt; feols(outcome ~ treatment + xc) |&gt; 
  modelsummary(gof_map=c('nobs'), stars=T)
```

# RDD Estimation: Choices

- We find a coefficient pretty close to `\(10\)`, which is the number we had simulated as the true treatment effect

- This is however but a very raw approach. 

- In reality, we have to make choices regarding:
  - Bandwidth
  - Functional form
  - Control variables
  
---

# Choices: Bandwidth

- The idea of RDD is that people _close to_ the cut-off are comparable, but people farther away might not be
- For example, your test score might be determined by your ability
  - So people with a low score have a very different ability than people with a high score
  - This is problematic, because then a comparison of outcomes between people with a high score and a low score might not only be due to the treatment, but also due to differences in ability

- However, we can assume that people within a narrow margin of the cut-off may be more similar to each other, therefore neutralizing the potential confounding influence of ability and other potential variables
  - People with a score of `\(5.4\)` and `\(5.6\)` are pretty similar, and it can be argued that there precise score is essentially due to randomness 
  
---

# Choices: Bandwidth

- Pay attention to the following sample sizes, effect sizes and standard errors:
  - As you can see, the effect approaches the true effect as we condition our sample to observations closer to the threshold


```r
models &lt;- map(c(3, 2, 1, 0.5), ~ df |&gt; mutate(xc = score - 5.5) |&gt;
                filter(abs(xc) &lt; .x) |&gt; feols(outcome ~ treatment))

modelsummary(models, stars=T, gof_map=c('nobs'))
```

# Choices: Bandwidth

- The idea of RDD is that observations just around the cut-off are comparable
- So we might limit our analysis to just a narrow window around the cut-off
- However, how narrow? And how many observations do we then retain?
  - There is a literature on _optimal bandwidth selection_
  - As we will see, there is an R package that implements these optimal bandwidths automatically
  - And you can choose whether you want to have a different bandwidth on both sides of the threshold
  - This can be useful if you have much more observations in the treatment or control group


---

# Choices: Functional Form

- Why would we only fit a straight line on both sides of the threshold?
- The relationship between the running variable and the outcome is potentially more complex
- A misspecified line can impact the RD estimates

- Hence, we want to estimate the relationship as well as possible

- A common way to do this is to use _non-parametric_ regression
  - These are flexible lines that do not presuppose any shape
  - This is generally thought to be better than polynomials
  
---

# Choices: Control Variables

- In principle, because treatment assignment around the threshold is random, you don't need control variables
- In practice, they can make your estimate more precise

- Another reason for searching for control variables is that you can do **placebo tests, also called tests for covariate balance**
- This involves looking at other, pre-treatment variables than the outcome, and see whether they change discontinuously at the threshold
- If they do, that is a problem, because your treatment assignment is _correlated_ with those variables
- If they don't, this makes the assumption of random treatment assignment stronger

---

# Rdrobust Estimation

- In R, the package `rdrobust` implements the optimal bandwidths automatically, and it also takes care of the functional form
- It estimates local linear regression, hence evading the issue of polynomials


```r
res &lt;- rdrobust::rdrobust(y=df$outcome, x=df$score, c=5.5)
```

- You can also add control variables in the following way:


```r
res &lt;- rdrobust::rdrobust(y=df$outcome, x=df$score, c=5.5, covs=cbind(df$var1, df$var2))
```

---

# Covariate Balance

- The only thing it does not implement is the covariate balance tables
- You want to see that the treatment and control group are equal in terms of all observable pre-treatment characteristics: 
  - Making it likely that they are also equal in terms of unobservables
- I demonstrate this using a toy data set:
  

```r
cars &lt;- mtcars |&gt; mutate(treat = if_else(row_number() &lt; 17, 
                                         "Treatment Group", 
                                         "Control Group"))
datasummary_balance(~ treat, 
                    cars |&gt; select(mpg, cyl, treat),
                    dinm_statistic = 'p.value')
```

# Geographic Regression Discontinuity

---

# Mining Mita

- Now, geographic regression discontinuity should be very simple for you to understand
- In geographic regression discontinuity, we use a geographic boundary as a _cut-off_ and the distance to that boundary as a _running variable_

  - Seminal paper: Dell (2010, Econometrica):

&gt; This study utilizes regression discontinuity to examine the long-run impacts of the mita, an extensive forced mining labor system in effect in Peru and Bolivia between 1573 and 1812. Results indicate that a mita effect lowers household consumption by around 25% and increases the prevalence of stunted growth in children by around 6 percentage points in subjected districts today. Using data from the Spanish Empire and Peruvian Republic to trace channels of institutional persistence, I show that the mita’s influence has persisted through its impacts on land tenure and public goods provision. Mita districts historically had fewer large landowners and lower educational attainment. Today, they are less integrated into road networks and their residents are substantially more likely to be subsistence farmers.

---


# Warning

- Borders are generally _not_ exogenous
  - Usually, borders are defined by some kind of geographical feature such as a river
  - In addition to the treatment variable, many things might change discretely at this boundary
  
- From Dell's (2010) paper:

&gt; [validity of the RD design] requires all relevant factors besides treatment to vary smoothly at the mita boundary (..), I focus exclusively on the portion that transects the Andean range in southern Peru. Much of the boundary tightly follows the steep Andean precipice, and hence has elevation and the ethnic distribution of the population changing discretely at the boundary. In contrast, elevation, the ethnic distribution, and other observables are statistically identical across the segment of the boundary on which this study focuses. 

---

# Dells' Strategy

- Dell considers the basic regression of the following form:

`$$c_{idb} = \alpha + \gamma \times \text{mita}_d + X'_i \beta + f(\text{geographic location}_d) + \phi_b + \epsilon_{idb}$$`


- where `\(c_{idb}\)` is an outcome of interest, `\(X_i\)` are control variables, and `\(f\)`(geographic location) are a set of geographical controls (longitude, latitude, elevation, temperature)
- Outcomes at level: village/household `\(i\)` in administrative district `\(d\)` along mita segment `\(b\)`
- The treatment is administered at the district level `\(d\)`

- Examples of `\(c_{idb}\)`: Household consumption, stunted growth
  - Mechanisms: Forced labor institutions vs. pro-market _haciendas_: rural estates with an attached labor force
  - Also: less integration in road networks, lowered educational levels

---

# Seminal Papers - Wahl

- This theme is inspired by Wahl (2017)'s paper, _Does European development have Roman roots? Evidence from the German Limes_

&gt; This paper contributes to the understanding of the long-run consequences of Roman rule on economic development. In ancient times, the area of contemporary Germany was divided into a Roman and a non-Roman part. The study uses this division to test whether the formerly Roman part of Germany are more developed than the non-Roman part. This is done using the Limes Germanicus wall as geographical discontinuity in a regression discontinuity design framework. The results indicate that economic development—as measured by luminosity—is indeed significantly and robustly larger in the formerly Roman part of Germany. The study identifies the persistence of the Roman road network until the present as an important factor causing this developmental advantage of the formerly Roman part of Germany both by fostering city growth and by allowing for a denser road network.

---

# Seminal Papers: Lowes &amp; Montero

- Lowes &amp; Montero also use a geographic regression discontinuity design by an arguably random border of the Congo Free State:

&gt; All colonial powers granted concessions to private companies to extract natural resources during the colonial era. In Africa, these concessions were characterized by indirect rule and violence. We use the arbitrarily defined borders of rubber concessions granted in the north of the Congo Free State to examine the causal effects of this form of economic organization on development. We find that historical exposure to the concessions causes significantly worse education, wealth, and health outcomes. To examine mechanisms, we collect survey and experimental data from individuals near a former concession boundary. We find that village chiefs inside the former concessions provide fewer public goods, are less likely to be elected, and are more likely to be hereditary. However, individuals in the concessions are more trusting, more cohesive, and more supportive of sharing income. We interpret our results as reflecting how institutions and culture may act as substitutes in the context of the widespread colonial concession system.

---

# Conclusion

- We have seen a recapitulation of regression discontinuity designs in economics

- We have seen the importance of choices regarding bandwidth, functional form and control variables

- We have learned to use the `rdrobust` package for RD analyses and learn to analyze the output

- We have learned to validate the RD design's assumptions by means of balancing tables

- As examples, we have studied several geographic regression discontinuity designs in the economics literature

  // Replace <script> tags in slides area to make them executable
  var scripts = document.querySelectorAll(
    '.remark-slides-area .remark-slide-container script'
  );
  if (!scripts.length) return;
  for (var i = 0; i < scripts.length; i++) {
    var s = document.createElement('script');
    var code = document.createTextNode(scripts[i].textContent);
    s.appendChild(code);
    var scriptAttrs = scripts[i].attributes;
    for (var j = 0; j < scriptAttrs.length; j++) {
      s.setAttribute(scriptAttrs[j].name, scriptAttrs[j].value);
    }
    scripts[i].parentElement.replaceChild(s, scripts[i]);
  }
})();
(function() {
  var links = document.getElementsByTagName('a');
  for (var i = 0; i < links.length; i++) {
    if (/^(https?:)?\/\//.test(links[i].getAttribute('href'))) {
      links[i].target = '_blank';
    }
  }
})();
// adds .remark-code-has-line-highlighted class to <pre> parent elements
// of code chunks containing highlighted lines with class .remark-code-line-highlighted
(function(d) {
  const hlines = d.querySelectorAll('.remark-code-line-highlighted');
  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
  };

  for (let line of hlines) {
    let pre = findPreParent(line);
    if (pre && !preParents.includes(pre)) preParents.push(pre);
  }
  preParents.forEach(p => p.classList.add("remark-code-has-line-highlighted"));
})(document);</script>

<script>
slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
slideshow._releaseMath(document);
</script>
