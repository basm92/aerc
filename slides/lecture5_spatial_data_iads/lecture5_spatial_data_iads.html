# Introduction

- In this lecture, we will get to know two new types of data, **spatial data** and **network data**

- **Spatial data** combines the features of data we already know with spacial features
  - Spatial data is getting more and more important, so we need tools to work with it
  - Depending on the specific spatial format, this can represent real-life geographical objects such as countries, roads, seas, or other geographical entities
  - It can also represent more abstract objects depicting distances between each other
  
- **Network data** describes relationships among units rather than units in isolation.
  - Examples include friendship networks among people, citation networks among academic articles, and trade and alliance networks among countries.
  - Network data is different from traditional data in that the unit of analysis is a relationship between two _nodes_

- Each of these provinces is represented as a _polygon_ and is geocoded
- The **bounding box** of `be` is represented by coordinates in a certain _coordinate system_

# Kinds of Spatial Data

- In general, there exist roughly two types of spatial data:
  
  - **Vector data**: represents things with _points, lines and polygons_. Vector data can scale and stretch and transform those easily with mathematical operations. Can increase precision to arbitrary levels (can always zoom in futher). It allows allows us to ask questions about statial relations, such as what is the area of an object, what is the distance from one object to another, or which objects border other objects. 
  - **Raster data**: fixed-size tiles or cells (like a mosaic, or like pixels), which form a grid. Fixed resolution. Raster data is like an image with geo-coded pixels. Satellite images, for example, are usually released in the form of raster data. Other examples of raster data include population density images, species occurence data, and meteorological data.
  
- As you might have guessed, `be` is an example of **vector data**.

---

# Example Raster Data

- Temperature data is an example of raster data:
  - Each "pixel" is geocoded and has a particular **value** for a particular variable, in this case, a temperature
  - Each geocoded value represents a particular temperature as measured (inferred) in a particular area marked by the "pixel"
  - Raster data can differ in terms of its granularity, i.e. how detailed the data is



&lt;img src="lecture5_spatial_data_iads_files/figure-html/temperature-1.png" width="40%" style="display: block; margin: auto;" /&gt;

# CRS 

- We all agree the earth is round (hopefully)
- However, you need coordinates to describe _where is what_
- Usually, this is based on a three-dimensional model of the earth
  - Coordinates are given in latitude and longitude.
  - An example CRS is EPSG:4326 (also known WGS 84).

- There also exist CRS that are "projected":
  - Transforms the earth’s curved surface onto a flat surface.
  - This advantage is that coordinates are given in linear units (e.g., meters).
  - Disadvantage: distorts surface
  - Example: Mercator projection, EPSG:3857
  
---

# CRS in R

- Setting a CRS: 


```r
library(sf)
point &lt;- st_point(c(4.8897, 52.3740))  # Amsterdam coordinates
sf_point &lt;- st_sfc(point, crs = 4326)
```

- Checking a CRS:


```r
st_crs(sf_point)[1] # Remove the [1] to see full output
```

```
## $input
## [1] "EPSG:4326"
```

- _Changing_ a CRS from one to another:


```r
sf_point_transformed &lt;- st_transform(sf_point, 3857)
```

# Working With Vector Data: Spatial

- In addition to working with spatial `sf` data.frames using the tidyverse library, there are also a couple of specific operations to spatial data

- Spatial operations, including spatial joins between vector datasets and local and several operations on raster datasets, are a vital part of geocomputation.
  - For more resources on this, see the [Geocomputation with R Ebook](https://r.geocompx.org/)

- We'll demonstrate a couple of spatial operations including:
  - **Spatial subsetting**
  - **Topological relations**
  - **Distance relations**
  
- In addition, there exists two other, more advanced subjects for study in other courses:
  - **Spatial joining**
  - **Spatial aggregations**

# Working With Vector Data: Topology

- **Topological relations** describe the spatial relationships between objects.
- These are logical statements (in that the answer can only be TRUE or FALSE) about the spatial relationships between two objects 

- A simple question is: which of the points in `schools_geocoded` intersect in some way with polygon of the city of Utrecht?
- This question can be answered with the spatial predicate `st_intersects()` as follows:

---

# Working With Vector Data: Topology

- `st_intersects()` with the argument `sparse=FALSE` returns a TRUE/FALSE for each datapoint in `schools_geocoded`


```r
# Find Polygon of Utrecht Municipality
gem_utrecht &lt;- cbs_get_sf("gemeente", 2023) |&gt; filter(statnaam == "Utrecht")
schools_geocoded &lt;- schools_geocoded |&gt;
  mutate(is_inside_utrecht_municipality = st_intersects(schools_geocoded,                                                        gem_utrecht, sparse=FALSE))
schools_geocoded |&gt;
  select(is_inside_utrecht_municipality) |&gt; head(3)
```

# Working With Vector Data: Topology

- In addition to `st_intersects()`, you can also use one of the following functions:

  - The opposite of `st_intersects()` is `st_disjoint()`, which returns only TRUE for objects that do not spatially relate in any way to the selecting object
  - The function `st_is_within_distance()` detects features that almost touch the selection object, which has an additional dist argument
  - `st_within()` and `st_touches()` returns T/F for objects in the first argument that are strictly within and strictly on the boundary of the second object
  
---

# Working With Vector Data: Distance

- While the topological relations presented in the previous section are binary (TRUE/FALSE), distance relations are continuous. 

- The distance between two sf objects is calculated with `st_distance()`
- `st_distance()` takes two arguments:
  - If you put in two spatial data.frames, you'll get back a **distance matrix**
  - I.e. a matrix reflecting the distance from each element in `\(x\)` to each element in `\(y\)`
  

```r
distance_matrix &lt;- st_distance(schools_geocoded, provincies)
dim(distance_matrix)
```

```
## [1] 6069   12
```

- Meaning this matrix contains the distance for 6065 schools to (the centroids of) 12 provinces.

---

# Working With Vector Data: Distance

- But sometimes, you might want to calculate the _minimum_ or _maximum_ distance between each object in a `data.frame` and another set of points or polygons

- You can do that using the following:
  - Take the distance matrix as before
  - For each row, ask what is the _minimum_ or _maximum_ element:


```r
max_distances &lt;- apply(distance_matrix, 1, max)
max_distances[1:10]
```

```
##  [1] 231081.6 225551.2 203325.0 231413.8 233384.6 235838.7 232801.0 204200.9
##  [9] 213738.4 216881.7
```

# Network Data

- Next, we consider **network data**, which describes relationships among units rather than units in isolation. 
- Examples include friendship networks among people, citation networks among academic articles, and trade and alliance networks among countries.

- Analysis of network data differs from the data analyses we have covered so far in that the **unit of analysis** is a relationship (Imai, 2018).

---

# Network Data Types

- The basic package to deal with network data in R is called `igraph`. Install it and load it
- Also install and load a package called `igraphdata`, which features some example datasets we'll use during this lecture


```r
library(igraph)
library(igraphdata)
```

- As a running example, we'll use a dataset from `igraphdata` called `Koenigsberg`:


```r
data(Koenigsberg)

# Background

- From `?Koenigsberg`

&gt; The Seven Bridges of Koenigsberg is a notable historical problem in mathematics. Its negative resolution by Leonhard Euler in 1735 laid the foundations of graph theory and presaged the idea of topology. The city of Koenigsberg in Prussia (now Kaliningrad, Russia) was set on both sides of the Pregel River, and included two large islands which were connected to each other and the mainland by seven bridges. 

&gt; The problem was to find a walk through the city that would cross each bridge once and only once. The islands could not be reached by any route other than the bridges, and every bridge must have been crossed completely every time (one could not walk half way onto the bridge and then turn around and later cross the other half from the other side).

# Network Data Types

- Networks are usually displayed as mathematical objects called **graphs**

- A graph `\(\mathcal{G}\)` consists of a set of nodes (or vertices) `\(V\)` and a set of edges (or ties) `\(E\)` , i.e., `\(\mathcal{G}=(V,E)\)`. 
- A node represents an individual unit and is typically depicted as a solid circle.
  - In our case: _Altstadt-Loebenicht, Kneiphof, Vorstadt-Haberbeg, Lomse_
- An edge, on the other hand, represents the existence of a relationship between any pair of nodes via a
line connecting those nodes.
  - In our case: a bridge
  
---

# Network Data Types

- Graphs can be contained in special matrices called **adjacency matrices**:
  - An adjacency matrix is a matrix whose entries represent the existence of relationships between two units (one unit represented by the row and the other represented by the column)
  
- In our case:


```r
adjacency_graph &lt;- graph.adjacency(as.matrix(Koenigsberg), mode="undirected")
plot(adjacency_graph)
```

# Analyzing Networks

- There exist a variety of graph-based measures that can quantify **centrality**, or the extent to which each node is
connected to other nodes and appears in the center of a graph.

- The **number of edges**, or degree, is perhaps the most crude measure of how well a node is connected to the other
nodes in a graph.

- For this example, let's consider the `karate` dataset:


```r
data(karate)
graph.adjacency(as.matrix(karate), mode="undirected") |&gt; plot()
```

# Analyzing Networks

_(From Imai, 2018)_

- Degree is problematically a **local measure** because it simply counts the number of edges that come out of a given node. As a result, it does not account for the structure of the graph beyond its immediate neighbors.

- As an alternative, we can count the **sum of edges** from a given node to all other nodes in a graph, including the ones that are not directly connected. 

- This measure, called farness, describes how far apart a given node is from each one of all other nodes in the graph. This contrasts with degree, which counts the number of connected nodes. The inverse of farness, closeness, represents another measure of centrality:

`$$\text{closeness}(v)=\frac{1}{\sum_{u \in V, u \neq v}  \text{distance}(v,u)}$$`

- The distance between two nodes is the number of edges in the shortest path, which is the shortest sequence
of connected nodes, between the two nodes of interest.

---

# Analyzing Networks

- In R, we use the `closeness()` function to calculate the closeness for each node:

# Geocoding Schools

- We will now geocode the schools:


```r
geocode_school &lt;- function(row){
  box &lt;- getbb(paste(row$STRAATNAAM, row$POSTCODE, ", Nederland"))
  centroid &lt;- data.frame(x=(box[1,1]+box[1,2])/2, y = (box[2,1]+box[2,2])/2)
  out &lt;- st_as_sf(centroid, coords = c('x', 'y'), crs='wgs84')
  return(out)
}

schools &lt;- schools |&gt;
  rowwise() |&gt;
  mutate(geom = geocode_school(cur_data()))

schools &lt;- schools |&gt; unnest_wider(col=geom) |&gt; st_as_sf(crs='wgs84')

schools |&gt; sf::st_write('schools_geocoded.geojson')
```

# Create Rasterized Data

- Create a grid of 50 by 50 and make sure it overlaps with Utrecht
- For each grid cell, count the schools
- Create a new grid on the basis of this count variable
- Either plot it right away, or convert it to raster (below)


```r
grid &lt;- st_make_grid(utrecht, n=c(50,50)) |&gt;
  st_intersection(utrecht) 

tab &lt;- st_intersects(grid, schools)

# Demonstration: Weather Raster Data

- Step 1: Download a list of **weather stations**
- Step 2: Download a **map** of the Netherlands
- Step 3: Use only **weather stations** in the Netherlands (not on sea)


```r
library(climate); library(stars); library(rnaturalearth)
stations &lt;- nearest_stations_ogimet(country = "Netherlands", 
                                    date = Sys.Date(), 
                                    no_of_stations=50,
                                 add_map=T) |&gt;
  st_as_sf(coords = c("lon", "lat"), 
           crs = 4326)

nl &lt;- rnaturalearth::ne_states(
  country="Netherlands",
  returnclass="sf") |&gt;
  filter(diss_me &lt; 5000)

stations &lt;- stations |&gt;
  st_filter(nl)
```

# Demonstration: Weather Raster Data

- Step 4: Dwonload the **weather data** and compute the average over January
- Step 5: Fix the **keys** to enable a merge
- Step 6: **Merge** with the station data


```r
weather &lt;- map(stations$wmo_id, ~ climate::meteo_ogimet('daily', 
                                                        date = c("2000-02-01", "2000-01-01"), 
                                                        station=.x))
avg_weather &lt;- weather |&gt;
  keep(~ is.numeric(.x$station_ID)) |&gt;
  reduce(bind_rows) |&gt;
  group_by(station_ID) |&gt;
  summarize(avg_temp = mean(TemperatureCAvg, na.rm=T))

avg_weather &lt;- avg_weather |&gt;
  mutate(station_ID = paste0('0', station_ID))

stations &lt;- stations |&gt;
  left_join(avg_weather, by = c('wmo_id' = 'station_ID')) |&gt;
  filter(!is.na(avg_temp))
```

# Demonstration: Weather Raster Data

- Step 7: Create a **50 pixel x 50 pixel grid** overlapping the Netherlands
- Step 8: Spatially **interpolate** (inverse-distance-weighting) the weather station data
- Step 9: Create a plot!


```r
library(gstat)
grd &lt;- st_make_grid(nl, n = c(50,50)) |&gt;
  st_as_stars() |&gt;
  st_crop(nl)

i &lt;- idw(formula=avg_temp~1, stations, grd)

plot &lt;- ggplot() + geom_stars(data = i, aes(fill=var1.pred, x=x,y=y)) +
  xlab(NULL) + ylab(NULL) +

# Spatial Data Packages

- Based on [Moraga (2022)](https://www.paulamoraga.com/book-spatial/r-packages-to-download-open-spatial-data.html):
  - The `giscoR` package contains open data at the country (or lower) level for **European Union countries**
  - The `geodata` package contains **climate data** (temperature, precipitation, wind speed) across time: in particular through the `worldclim_country()` function
  - The package `chirps` contains daily high-resolution **precipitation**, as well as daily maximum and minimum temperatures from the Climate Hazards Group database.
  - The `elevatr` package can download **elevation data** from Amazon Web Services (AWS) Terrain Tiles and OpenTopography Global Digital Elevation Models API. Through the `get_elev_raster()` function, it can be used to download elevation at the locations specified in argument locations and with a zoom specified in argument `z`
  - `osmdata` allows you to download data from **OpenStreetMap**. OpenStreetMap (OSM) is an open world geographic database updated and maintained by a community of volunteers. We can use the osmdata package (Padgham et al. 2023) to retrieve OSM data including rivers roads, shops, railway stations, and other buildings.  
  - The `rWBclimate` data [available here](https://github.com/ropensci/rWBclimate) provides access to three different classes of climate data at two different spatial scales. 
  
---

# Spatial Data Packages

- The `spocc` package is an interface to many species occurrence data sources including Global Biodiversity Information Facility (GBIF)
- The `wopr` package provides access to the WorldPop Open Population Repository and provides estimates of population sizes for specific geographic areas
- The `rdhs` package gives the users the ability to access and analyze the (geocoded) Demographic and Health Survey (DHS) data. 
- The `openair` package contains air quality data and other atmospheric composition data.
- The `malariaAtlas` package can be used to download global malaria data hosted by the Malaria Atlas Project.
- The `GAEZr` package ([Installable here](https://floswald.github.io/GAEZr/)) facilitate downloading and processing of Global Agro-Ecological Zones data in R
- The `rnaturalearth` package makes mapping easy by making natural earth map data from [Natural Earth Data](https://www.naturalearthdata.com/) available
- The `rWBclimate` package ([here](https://github.com/ropensci/rWBclimate)) is an R interface for the World Bank climate data used in the World Bank climate knowledge portal.
- The `climate` package automatizes downloading of in-situ meteorological and hydrological data from publicly available repositories
